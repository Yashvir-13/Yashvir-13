    <path d="M 0.0 285.0 L 18.8 285.7 L 37.5 286.2 L 56.3 286.4 L 75.0 286.0 L 93.8 284.9 L 112.5 283.4 L 131.3 281.7 L 150.0 280.1 L 168.8 279.2 L 187.5 279.1 L 206.3 280.2 L 225.0 282.3 L 243.8 285.2 L 262.5 288.5 L 281.3 291.6 L 300.0 294.0 L 318.8 295.1 L 337.5 294.7 L 356.3 292.6 L 375.0 289.1 L 393.8 284.7 L 412.5 280.2 L 431.3 276.1 L 450.0 273.3 L 468.8 272.2 L 487.5 273.1 L 506.3 275.9 L 525.0 280.2 L 543.8 285.3 L 562.5 290.5 L 581.3 294.8 L 600.0 297.7 L 618.8 298.6 L 637.5 297.4 L 656.3 294.3 L 675.0 289.8 L 693.8 284.7 L 712.5 279.7 L 731.3 275.7 L 750.0 273.3 L 768.8 272.7 L 787.5 274.0 L 806.3 276.9 L 825.0 280.9 L 843.8 285.2 L 862.5 289.2 L 881.3 292.3 L 900.0 294.0 L 918.8 294.2 L 937.5 292.9 L 956.3 290.6 L 975.0 287.7 L 993.8 284.8 L 1012.5 282.4 L 1031.3 280.8 L 1050.0 280.1 L 1068.8 280.4 L 1087.5 281.4 L 1106.3 282.7 L 1125.0 284.0 L 1143.8 285.0 L 1162.5 285.5 L 1181.3 285.5 L 1200.0 285.0" stroke="url(#wave-grad)" stroke-width="1.25" opacity="0.55" />
    <path d="M 0.0 285.0 L 18.8 285.3 L 37.5 286.0 L 56.3 287.2 L 75.0 288.6 L 93.8 290.0 L 112.5 291.4 L 131.3 292.3 L 150.0 292.8 L 168.8 292.6 L 187.5 291.6 L 206.3 289.8 L 225.0 287.4 L 243.8 284.4 L 262.5 280.9 L 281.3 277.4 L 300.0 274.0 L 318.8 271.0 L 337.5 268.7 L 356.3 267.4 L 375.0 267.1 L 393.8 267.9 L 412.5 270.0 L 431.3 273.2 L 450.0 277.2 L 468.8 282.0 L 487.5 287.1 L 506.3 292.2 L 525.0 297.0 L 543.8 301.1 L 562.5 304.3 L 581.3 306.3 L 600.0 307.0 L 618.8 306.3 L 637.5 304.3 L 656.3 301.1 L 675.0 297.0 L 693.8 292.2 L 712.5 287.1 L 731.3 282.0 L 750.0 277.2 L 768.8 273.2 L 787.5 270.0 L 806.3 267.9 L 825.0 267.1 L 843.8 267.4 L 862.5 268.7 L 881.3 271.0 L 900.0 274.0 L 918.8 277.4 L 937.5 280.9 L 956.3 284.4 L 975.0 287.4 L 993.8 289.8 L 1012.5 291.6 L 1031.3 292.6 L 1050.0 292.8 L 1068.8 292.3 L 1087.5 291.4 L 1106.3 290.0 L 1125.0 288.6 L 1143.8 287.2 L 1162.5 286.0 L 1181.3 285.3 L 1200.0 285.0" stroke="url(#wave-grad)" stroke-width="1.8" opacity="0.86" />
  </g>

  <!-- The Eclipse Halo (Optical Corona via smooth radial gradient) -->
  <circle cx="600" cy="182" r="120" fill="url(#eclipse-corona)" />
  <circle cx="600" cy="182" r="98.5" fill="none" stroke="#D99B52" stroke-width="2" opacity="0.85">
    <animate attributeName="opacity" values="0.55;0.92;0.55" dur="7s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="182" r="96.8" fill="none" stroke="#ECEAE4" stroke-width="1.5" opacity="0.78" />

  <!-- Core Dark Body (Eclipse / Camera Obscura) -->
  <circle cx="600" cy="182" r="96" fill="#060709" />
  <circle cx="600" cy="182" r="95" fill="none" stroke="#ECEAE4" stroke-width="0.6" opacity="0.35" />

  <!-- Subtle Inner Geometry Inside the Black Box -->
  <g stroke="#D99B52" stroke-width="0.75" fill="none" opacity="0.34">
    <polygon points="600,122.48 653.76,214.64 546.24,214.64" />
    <circle cx="600" cy="182" r="32.64" stroke="#94B8D7" />
    <circle cx="600" cy="182" r="2.4" fill="#D99B52" />
  </g>

  <!-- Horizon Line & Ground Reflection -->
  <line x1="0" y1="285" x2="1200" y2="285" stroke="#ECEAE4" stroke-width="1" opacity="0.22" />
  <rect x="0" y="285" width="1200" height="135" fill="url(#horizon-glow)" opacity="0.75" />

  <!-- Monolith / Observer Silhouette -->
  <rect x="586" y="252" width="28" height="82" fill="#030406" opacity="0.96" />
  <rect x="586" y="252" width="28" height="82" fill="none" stroke="#ECEAE4" stroke-width="0.6" opacity="0.3" />

  <!-- Honest Editorial Caption Along Lower Third -->
  <text x="600" y="362" text-anchor="middle" font-family="Georgia, 'Cormorant Garamond', serif" font-style="italic" font-size="15.5" fill="#ECEAE4" opacity="0.88" letter-spacing="0.4">
    “Studying the geometry inside the black box — through code, cinema, music, and philosophy.”
  </text>

  
  <!-- 35mm Contact Sheet & Optical Frame Annotations -->
  <g font-family="ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="10" fill="#94969C" opacity="0.72" letter-spacing="1.6">
    <text x="42" y="36">FRAME 001A · 35MM OPTICAL</text>
    <text x="600" y="36" text-anchor="middle">PERCEPTION · REPRESENTATION · CINEMA · ACOUSTICS</text>
    <text x="1158" y="36" text-anchor="end">ASPECT 2.85:1</text>

    <!-- Corner Registration Crop Marks -->
    <path d="M 28 46 L 28 24 L 50 24" fill="none" stroke="#D99B52" stroke-width="1" opacity="0.65" />
    <path d="M 1172 46 L 1172 24 L 1150 24" fill="none" stroke="#D99B52" stroke-width="1" opacity="0.65" />
    <path d="M 28 374 L 28 396 L 50 396" fill="none" stroke="#D99B52" stroke-width="1" opacity="0.65" />
    <path d="M 1172 374 L 1172 396 L 1150 396" fill="none" stroke="#D99B52" stroke-width="1" opacity="0.65" />

    <text x="42" y="390">YASHVIR SINGH · YASHVIR-13</text>
    <text x="1158" y="390" text-anchor="end">f/1.4 · 50MM · LATENT MANIFOLD</text>
  </g>

  <!-- 35mm Film Grain Texture Overlay -->
  <rect width="1200" height="420" fill="url(#film-grain)" opacity="0.48" style="pointer-events:none;" />
</svg>