<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" role="img" aria-label="Yashvir Singh — Optical and Acoustic Monograph Header">
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="72%">
      <stop offset="0%" stop-color="#121318" />
      <stop offset="100%" stop-color="#060709" />
    </radialGradient>

    <radialGradient id="amber-aura" cx="50%" cy="43%" r="38%">
      <stop offset="0%" stop-color="#D99B52" stop-opacity="0.26" />
      <stop offset="55%" stop-color="#94B8D7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#060709" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="eclipse-corona" cx="50%" cy="50%" r="50%">
      <stop offset="68%" stop-color="#060709" stop-opacity="0" />
      <stop offset="83%" stop-color="#D99B52" stop-opacity="0.45" />
      <stop offset="91%" stop-color="#ECEAE4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#060709" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="horizon-glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#D99B52" stop-opacity="0.15" />
      <stop offset="35%" stop-color="#94B8D7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#060709" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="wave-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#94B8D7" stop-opacity="0" />
      <stop offset="22%" stop-color="#94B8D7" stop-opacity="0.48" />
      <stop offset="50%" stop-color="#D99B52" stop-opacity="0.88" />
      <stop offset="78%" stop-color="#94B8D7" stop-opacity="0.48" />
      <stop offset="100%" stop-color="#94B8D7" stop-opacity="0" />
    </linearGradient>

    <pattern id="film-grain" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="22" r="0.6" fill="#ECEAE4" opacity="0.18" />
      <circle cx="68" cy="11" r="0.5" fill="#ECEAE4" opacity="0.14" />
      <circle cx="102" cy="48" r="0.7" fill="#D99B52" opacity="0.16" />
      <circle cx="37" cy="79" r="0.5" fill="#ECEAE4" opacity="0.15" />
      <circle cx="89" cy="96" r="0.6" fill="#94B8D7" opacity="0.15" />
      <circle cx="53" cy="44" r="0.4" fill="#ECEAE4" opacity="0.12" />
      <circle cx="19" cy="108" r="0.6" fill="#ECEAE4" opacity="0.14" />
    </pattern>
  </defs>

  <!-- Base Darkroom Field -->
  <rect width="1200" height="420" fill="url(#bg)" />
  <rect width="1200" height="420" fill="url(#amber-aura)" />

  <!-- Subtle Geometric Optical Grid & Focal Rays -->
  <g stroke="#ECEAE4" opacity="0.07" stroke-width="0.75">
    <line x1="600" y1="18" x2="600" y2="402" stroke-dasharray="3 6" />
    <line x1="220" y1="182" x2="980" y2="182" stroke-dasharray="2 8" />
    <circle cx="600" cy="182" r="154" fill="none" stroke-dasharray="4 8" />
    <circle cx="600" cy="182" r="214" fill="none" />
    <line x1="360" y1="42" x2="840" y2="322" />
    <line x1="360" y1="322" x2="840" y2="42" />
  </g>

  <!-- Aperture Measurement Ring -->
  <circle cx="600" cy="182" r="124" fill="none" stroke="#D99B52" stroke-width="1" stroke-dasharray="2 8" opacity="0.38">
    <animate attributeName="r" values="122;127;122" dur="8s" repeatCount="indefinite" />
  </circle>

  <!-- Starfield / Dust Particles -->
  <g fill="#ECEAE4" opacity="0.34">
    <circle cx="170" cy="118" r="1.0" />
    <circle cx="285" cy="76" r="0.7" />
    <circle cx="430" cy="64" r="1.2" />
    <circle cx="775" cy="72" r="0.9" />
    <circle cx="930" cy="108" r="1.4" />
    <circle cx="1040" cy="176" r="0.8" />
    <circle cx="885" cy="238" r="0.7" />
    <circle cx="315" cy="242" r="1.1" />
    <circle cx="135" cy="264" r="1.3" />
  </g>

  <!-- Acoustic & Signal Phase Harmonic Curves -->
  <g fill="none">
