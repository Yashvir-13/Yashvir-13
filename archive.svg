<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600">
<defs>
<radialGradient id="bg" cx="55%" cy="45%" r="80%"><stop stop-color="#171716"/><stop offset=".55" stop-color="#0d0e0d"/><stop offset="1" stop-color="#050606"/></radialGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e6dfce" stop-opacity=".18"/><stop offset=".45" stop-color="#c8bfae" stop-opacity=".055"/><stop offset="1" stop-color="#c8bfae" stop-opacity="0"/></linearGradient>
<radialGradient id="lamp"><stop stop-color="#fff4d8" stop-opacity=".9"/><stop offset=".25" stop-color="#d8c9a8" stop-opacity=".22"/><stop offset="1" stop-color="#d8c9a8" stop-opacity="0"/></radialGradient>
<filter id="blur"><feGaussianBlur stdDeviation="25"/></filter>
<filter id="grain"><feTurbulence baseFrequency=".72" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .48 0 0 0 .44 0 0 0 .05 0"/></filter>
<style>
.m{font-family:'Courier New',monospace}.s{font-family:Georgia,'Times New Roman',serif}
@keyframes scan{0%{transform:translateY(-300px);opacity:0}15%{opacity:.18}85%{opacity:.18}100%{transform:translateY(300px);opacity:0}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.5}}
@keyframes spin{to{transform:rotate(360deg)}} .scan{animation:scan 7s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}.spin{animation:spin 22s linear infinite;transform-origin:1110px 245px}
</style></defs>
<rect width="1400" height="600" fill="url(#bg)"/>
<g stroke="#c8c4bb" stroke-opacity=".10" fill="none"><path d="M55 55H1345M55 545H1345M55 55V545M1345 55V545"/><path d="M55 108H1345M55 492H1345"/></g>

<!-- projector beam -->
<path d="M1030 185 L1375 65 L1375 410 L1030 300 Z" fill="url(#beam)"/>
<ellipse cx="1030" cy="242" rx="34" ry="70" fill="url(#lamp)" filter="url(#blur)"/>
<ellipse class="pulse" cx="1030" cy="242" rx="24" ry="48" fill="url(#lamp)"/>

<!-- film reel -->
<g class="spin" stroke="#c8c4bb" stroke-opacity=".28" fill="none" stroke-width="4">
<circle cx="1110" cy="245" r="112"/><circle cx="1110" cy="245" r="78"/><circle cx="1110" cy="245" r="18" fill="#0b0c0b"/>
<circle cx="1110" cy="171" r="18"/><circle cx="1174" cy="282" r="18"/><circle cx="1046" cy="282" r="18"/><circle cx="1046" cy="208" r="18"/><circle cx="1174" cy="208" r="18"/>
</g>

<!-- technical grid -->
<g stroke="#a8a39a" stroke-opacity=".08">
<path d="M90 120V480"/><path d="M144 120V480"/><path d="M198 120V480"/><path d="M252 120V480"/><path d="M306 120V480"/><path d="M360 120V480"/><path d="M414 120V480"/><path d="M468 120V480"/><path d="M522 120V480"/><path d="M576 120V480"/><path d="M630 120V480"/>
<path d="M90 120H690"/><path d="M90 180H690"/><path d="M90 240H690"/><path d="M90 300H690"/><path d="M90 360H690"/><path d="M90 420H690"/><path d="M90 480H690"/>
</g>

<!-- matrix fragments -->
<g class="m" font-size="10" fill="#aaa69e" opacity=".24">
<text x="82" y="142">01100101 01011010 00110101</text><text x="82" y="160">01000110 01110010 01100001</text><text x="82" y="178">10110100 00101101 01001001</text><text x="82" y="196">11001010 01110001 00110110</text>
<text x="520" y="438">0x4F 0x52 0x42 0x49 0x54</text><text x="520" y="456">FRAME_001 / OPTICAL_PATH / ACTIVE</text>
</g>

<g class="m" fill="#aaa69e">
<text x="78" y="88" font-size="12" letter-spacing="3">YASHVIR-13 / HUMAN.EXE</text>
<text x="1322" y="88" text-anchor="end" font-size="11" letter-spacing="2">SYSTEM STATUS :: ONLINE</text>
<text x="78" y="515" font-size="10" letter-spacing="2">ENGINEER // BUILDER // RESEARCHER</text>
<text x="1322" y="515" text-anchor="end" font-size="10" letter-spacing="2">REC 02:17:31 // FRAME 001</text>
</g>

<g class="pulse">
<text x="82" y="285" class="s" fill="#e1ddd4" font-size="82" letter-spacing="8">YASHVIR</text>
<text x="88" y="326" class="m" fill="#b1ada5" font-size="12" letter-spacing="4">IDEAS / ALGORITHMS / EXPERIMENTS / REALITY</text>
</g>

<g class="m" fill="#817c74" font-size="11"><text x="1280" y="178">01</text><text x="1280" y="198">02</text><text x="1280" y="218">03</text><text x="1280" y="238">04</text><text x="1280" y="258">05</text></g>
<rect class="scan" x="55" y="120" width="1290" height="2" fill="#d7cdb8"/>
<rect width="1400" height="600" filter="url(#grain)" opacity=".28"/>
</svg>