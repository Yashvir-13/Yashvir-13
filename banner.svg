<svg width="100%" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Yashvir — profile banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="beam" cx="0%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#e0ddd7" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#732626" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#0e0d0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0ddd7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e0ddd7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#e0ddd7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="#0e0d0b"/>

  <!-- projector beam -->
  <polygon points="95,150 520,55 520,245" fill="url(#beam)">
    <animate attributeName="opacity" values="0.55;0.9;0.55" dur="7s" repeatCount="indefinite"/>
  </polygon>

  <!-- film reel -->
  <g transform="translate(95,150)">
    <g stroke="#e0ddd7" stroke-opacity="0.45" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="22s" repeatCount="indefinite"/>
      <circle r="54" stroke-width="1.4"/>
      <circle r="15" stroke="#732626" stroke-opacity="0.85" stroke-width="2"/>
      <g stroke-width="1.3" stroke-opacity="0.4">
      <line x1="0" y1="0" x2="0.0" y2="-50.0"/>
      <line x1="0" y1="0" x2="43.3" y2="-25.0"/>
      <line x1="0" y1="0" x2="43.3" y2="25.0"/>
      <line x1="0" y1="0" x2="0.0" y2="50.0"/>
      <line x1="0" y1="0" x2="-43.3" y2="25.0"/>
      <line x1="0" y1="0" x2="-43.3" y2="-25.0"/>
      </g>
      <g fill="#0e0d0b" stroke-width="1" stroke-opacity="0.5">
      <circle cx="0.0" cy="-33.0" r="4"/>
      <circle cx="28.6" cy="-16.5" r="4"/>
      <circle cx="28.6" cy="16.5" r="4"/>
      <circle cx="0.0" cy="33.0" r="4"/>
      <circle cx="-28.6" cy="16.5" r="4"/>
      <circle cx="-28.6" cy="-16.5" r="4"/>
      </g>
    </g>
  </g>

  <!-- sweeping dust of light -->
  <rect x="-320" y="0" width="320" height="300" fill="url(#sweep)">
    <animate attributeName="x" values="-320;1200" dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- name -->
  <text x="585" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="66" fill="#e0ddd7" letter-spacing="9" opacity="0">
    YASHVIR
    <animate attributeName="opacity" values="0;1" dur="1.6s" begin="0.3s" fill="freeze"/>
  </text>

  <text x="588" y="186" font-family="'Courier New', monospace" font-size="14" fill="#8a857c" letter-spacing="3" opacity="0">
    SOFTWARE ENGINEER // MACHINE LEARNING // SYSTEMS
    <animate attributeName="opacity" values="0;1" dur="1.6s" begin="1.1s" fill="freeze"/>
  </text>

  <!-- blinking archival timestamp -->
  <text x="588" y="215" font-family="'Courier New', monospace" font-size="12" fill="#732626" letter-spacing="2" opacity="0">
    // 02:17
    <animate attributeName="opacity" values="0;0;1;1;0.3;1" dur="1.6s" begin="1.7s" fill="freeze"/>
  </text>

  <!-- corner metadata -->
  <text x="30" y="270" font-family="'Courier New', monospace" font-size="11" fill="#5a564f" letter-spacing="2">FRAME 001 · STATUS ACTIVE</text>
  <text x="1170" y="30" text-anchor="end" font-family="'Courier New', monospace" font-size="11" fill="#5a564f" letter-spacing="2">[ BUILD · OBSERVE · REPEAT ]</text>
</svg>
